name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check card syntax
        run: node --check dist/plant-monitor-premium-card.js

      - name: Run regression tests
        run: node --test tests/card.test.js
